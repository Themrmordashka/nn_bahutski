	async function trainNIST(tensorX,tensorY,valTensorX,valTensorY){
    const model = tf.sequential();
    model.add(tf.layers.inputLayer({inputShape: [28,28,1]}));
    model.add(tf.layers.rescaling({scale: 1/255}));
    model.add(tf.layers.flatten());
    model.add(tf.layers.dense({units: 128,activation: 'relu',useBias: true,kernelRegularizer: tf.regularizers.l2({l2: 1e-4})}));
    model.add(tf.layers.dense({units: 10, activation: 'softmax', useBias: true}));

    model.compile({
        optimizer: tf.train.adam(0.001),
        loss: 'categoricalCrossentropy',
        metrics: ['accuracy']
    });

    await model.fit(tensorX, tensorY, {
        epochs: 25,
        batchSize: 128,
        shuffle: true,
        validationData: [valTensorX, valTensorY],
        callbacks: tfvis.show.fitCallbacks(surface2, ['loss','val_loss']),
    });
		//let validArr
		let valTensorPredict = model.predict(valTensorX);
		let valArrayPredict = valTensorPredict.arraySync();
